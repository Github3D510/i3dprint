<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Démo Luma-Web - Background Removal & Scène personnalisée</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
      canvas { display: block; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./index.css">
    <!-- Import map pour charger three.js et Luma-Web (version 0.2.0 comme dans la documentation) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/",
          "@lumaai/luma-web": "https://unpkg.com/@lumaai/luma-web@0.2.0/dist/library/luma-web.module.js"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="demoCanvas"></canvas>
    <div class="p-4">
      <form id="orderForm" class="space-y-2">
        <div><label>Nom: <input type="text" name="customerName" required class="border" /></label></div>
        <div><label>Email: <input type="email" name="customerEmail" required class="border" /></label></div>
        <div><label>Fichier STL: <input type="file" name="fileInput" required /></label></div>
        <div><label>Volume (cm³): <input type="number" step="0.1" id="volumeInput" required class="border" /></label></div>
        <div><label>Matériau: <select id="materialSelect" class="border"></select></label></div>
        <div><label>Remplissage (%): <input type="number" id="infillInput" value="20" min="0" max="100" class="border" /></label></div>
        <div><label>Hauteur de couche (mm): <select id="layerHeightInput" class="border"><option value="0.1">0.1</option><option value="0.2" selected>0.2</option><option value="0.3">0.3</option><option value="0.4">0.4</option></select></label></div>
        <div>Prix estimé: <span id="priceDisplay" class="font-bold"></span></div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2">Commander</button>
      </form>
    </div>
    <script type="module" src="./src/index.js"></script>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { LumaSplatsSemantics, LumaSplatsThree } from '@lumaai/luma-web';

      // Récupérer le canvas
      const canvas = document.getElementById('demoCanvas');

      // Créer le renderer et définir sa taille
      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      // Définir la couleur de fond du renderer (optionnel)
      renderer.setClearColor(0x151515); // par exemple, gris foncé

      // Créer une scène Three.js
      const scene = new THREE.Scene();
      // Modifier l'arrière-plan de la scène (si vous préférez gérer via la scène)
      renderer.setClearColor(0xeeeeee, 1);


      // Créer une caméra
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.z = 5;

      // Ajouter des contrôles orbit
      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;

      // Charger votre capture Luma avec background removal
      const splats = new LumaSplatsThree({
        source: 'https://lumalabs.ai/capture/498436eb-fe36-4e48-9672-e27447c3d522'
      });
      // Ajouter les splats à la scène
      scene.add(splats);
      // Afficher uniquement le premier plan (foreground)
      splats.semanticsMask = LumaSplatsSemantics.FOREGROUND;


      // Ajouter quelques lumières pour améliorer la visibilité de la scène
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(5, 5, 5);
      scene.add(directionalLight);

      // Boucle d'animation
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      // Gestion du redimensionnement de la fenêtre
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
